name: Azure Deploy
on:
  pull_request:
    branches: [main]
    paths: ["**.bicep*", "**.snapshot.json", ".github/workflows/azure-deploy.yml"]
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

env:
  azure_client_id: 6508f7ca-0b5a-436d-ab64-d7ad4f28ba2e
  azure_providers: Microsoft.OperationalInsights,Microsoft.Storage
  azure_subscription_id: df56d048-2e20-4ab6-82b7-11643163aa53
  azure_tenant_id: d993d9e4-644e-4d0a-ba80-0e010d0ea023
  cost_threshold: 100
  currency: EUR
  deployment_mode: stack
  location: westeurope
  log_severity: INFO
  rule_option: ps-rule.yaml
  scope: sub
  template: main.bicep
  template_parameters: main.bicepparam
  version_ace_tool: "1.6.5"

jobs:
  plan:
    name: 🗓️ Plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      providers: ${{ steps.plan.outputs.providers }}
      bicep_version: ${{ steps.plan.outputs.bicep_version }}
      stack_settings: ${{ steps.plan.outputs.stack_settings }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plan
        id: plan
        uses: innofactororg/bicep-action/.github/actions/plan@v1
        with:
          azure_client_id: ${{ env.azure_client_id }}
          azure_providers: ${{ env.azure_providers }}
          azure_subscription_id: ${{ env.azure_subscription_id }}
          azure_tenant_id: ${{ env.azure_tenant_id }}
          cost_threshold: ${{ env.cost_threshold }}
          currency: ${{ env.currency }}
          deployment_mode: ${{ env.deployment_mode }}
          location: ${{ env.location }}
          log_severity: ${{ env.log_severity }}
          rule_option: ${{ env.rule_option }}
          scope: ${{ env.scope }}
          template: ${{ env.template }}
          template_parameters: ${{ env.template_parameters }}
          version_ace_tool: ${{ env.version_ace_tool }}

  deploy:
    name: 🏃 Deploy
    needs: plan
    environment: demo
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        id: deploy
        uses: innofactororg/bicep-action/.github/actions/deploy@v1
        with:
          azure_client_id: ${{ env.azure_client_id }}
          azure_providers: ${{ needs.plan.outputs.providers }}
          azure_subscription_id: ${{ env.azure_subscription_id }}
          azure_tenant_id: ${{ env.azure_tenant_id }}
          bicep_version: ${{ needs.plan.outputs.bicep_version }}
          deployment_mode: ${{ env.deployment_mode }}
          location: ${{ env.location }}
          log_severity: ${{ env.log_severity }}
          plan_stack_settings: ${{ needs.plan.outputs.stack_settings }}
          scope: ${{ env.scope }}
          template: ${{ env.template }}
          template_parameters: ${{ env.template_parameters }}
